<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 200" width="840" height="200">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 36px; fill: #E6EDF3; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #8B949E; }
      .badge-bg { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #58A6FF; letter-spacing: 1.5px; }
      .dot { fill: #3FB950; }
      .line-accent { fill: none; stroke: url(#accent-line); stroke-width: 2; stroke-linecap: round; }
      @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
      .blink { animation: blink 2.5s infinite ease-in-out; }
    </style>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="50%" stop-color="#BC8CFF"/>
      <stop offset="100%" stop-color="#F778BA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="840" height="200" rx="12" class="bg"/>

  <!-- Top accent line -->
  <line x1="30" y1="0" x2="810" y2="0" stroke="url(#accent-line)" stroke-width="3"/>

  <!-- Badge -->
  <g transform="translate(40, 40)">
    <rect class="badge-bg" x="0" y="0" width="130" height="26" rx="13"/>
    <circle class="dot blink" cx="16" cy="13" r="4"/>
    <text x="28" y="17" class="badge-text">FULL-STACK DEV</text>
  </g>

  <!-- Name -->
  <text x="40" y="108" class="name">Jonus Nattapong</text>

  <!-- Tagline -->
  <text x="42" y="138" class="tagline">Building fast, modern &amp; scalable digital systems.</text>

  <!-- Decorative line -->
  <line x1="42" y1="158" x2="300" y2="158" class="line-accent"/>

  <!-- Right side: minimal code snippet -->
  <g transform="translate(520, 50)">
    <rect x="0" y="0" width="280" height="110" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Terminal dots -->
    <circle cx="16" cy="16" r="4" fill="#F85149" opacity="0.8"/>
    <circle cx="30" cy="16" r="4" fill="#D29922" opacity="0.8"/>
    <circle cx="44" cy="16" r="4" fill="#3FB950" opacity="0.8"/>
    <!-- Code lines -->
    <text x="16" y="48" font-family="monospace" font-size="12" fill="#8B949E">const dev = {</text>
    <text x="30" y="66" font-family="monospace" font-size="12" fill="#79C0FF">name</text>
    <text x="60" y="66" font-family="monospace" font-size="12" fill="#8B949E">: </text>
    <text x="72" y="66" font-family="monospace" font-size="12" fill="#A5D6FF">'Jonus'</text>
    <text x="120" y="66" font-family="monospace" font-size="12" fill="#8B949E">,</text>
    <text x="30" y="84" font-family="monospace" font-size="12" fill="#79C0FF">stack</text>
    <text x="68" y="84" font-family="monospace" font-size="12" fill="#8B949E">: [</text>
    <text x="86" y="84" font-family="monospace" font-size="12" fill="#A5D6FF">'TS'</text>
    <text x="110" y="84" font-family="monospace" font-size="12" fill="#8B949E">, </text>
    <text x="120" y="84" font-family="monospace" font-size="12" fill="#A5D6FF">'React'</text>
    <text x="168" y="84" font-family="monospace" font-size="12" fill="#8B949E">, </text>
    <text x="178" y="84" font-family="monospace" font-size="12" fill="#A5D6FF">'Go'</text>
    <text x="200" y="84" font-family="monospace" font-size="12" fill="#8B949E">]</text>
    <text x="16" y="102" font-family="monospace" font-size="12" fill="#8B949E">};</text>
  </g>
</svg>
