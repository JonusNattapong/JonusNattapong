<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&amp;family=Space+Mono&amp;display=swap');
      
      .text-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#title-gradient);
      }
      
      .text-subtitle {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #9CA3AF;
      }
      
      .text-accent {
        font-family: 'Space Mono', monospace;
        font-weight: 600;
        font-size: 14px;
        fill: #06B6D4;
        letter-spacing: 2px;
      }
      
      .text-code {
        font-family: 'Space Mono', monospace;
        font-size: 13px;
        fill: #6B7280;
      }
      
      /* Pulse Animation for Blobs */
      @keyframes float-slow {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -40px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.95); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      
      @keyframes float-medium {
        0% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-40px, 30px) scale(1.15); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      
      @keyframes typing {
        from { width: 0; }
        to { width: 100%; }
      }
      
      .blob-1 {
        animation: float-slow 12s infinite ease-in-out;
        transform-origin: 50% 50%;
      }
      
      .blob-2 {
        animation: float-medium 15s infinite ease-in-out;
        transform-origin: 50% 50%;
      }
      
      .glowing-grid {
        stroke: #1F2937;
        stroke-width: 1;
        opacity: 0.35;
      }
      
      .code-bracket {
        font-family: 'Outfit', sans-serif;
        font-size: 120px;
        font-weight: 300;
        fill: #374151;
        opacity: 0.2;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070A13" />
    </linearGradient>

    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="cyan-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D946EF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Soft Glow Filters -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="50" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="300" rx="16" fill="url(#bg-gradient)" />

  <!-- Animated Glowing Background Blobs -->
  <g filter="url(#glow-heavy)">
    <circle class="blob-1" cx="150" cy="100" r="80" fill="#3B82F6" opacity="0.25" />
    <circle class="blob-2" cx="650" cy="220" r="100" fill="#EC4899" opacity="0.2" />
    <circle class="blob-1" cx="450" cy="80" r="60" fill="#8B5CF6" opacity="0.2" />
  </g>

  <!-- Coding Grid Pattern -->
  <g class="glowing-grid">
    <!-- Vertical Lines -->
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="650" y1="0" x2="650" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <!-- Horizontal Lines -->
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Stylized Decorative Elements -->
  <!-- Left Large Code Bracket -->
  <text x="25" y="190" class="code-bracket">&lt;</text>
  <!-- Right Large Code Bracket -->
  <text x="710" y="190" class="code-bracket">/&gt;</text>

  <!-- Glowing Accent Lines -->
  <rect x="0" y="0" width="800" height="4" fill="url(#title-gradient)" />
  <rect x="0" y="296" width="800" height="4" fill="url(#title-gradient)" />

  <!-- Corner Tech Elements -->
  <rect x="20" y="20" width="10" height="2" fill="#374151" />
  <rect x="20" y="20" width="2" height="10" fill="#374151" />
  
  <rect x="770" y="20" width="10" height="2" fill="#374151" />
  <rect x="778" y="20" width="2" height="10" fill="#374151" />

  <rect x="20" y="278" width="10" height="2" fill="#374151" />
  <rect x="20" y="270" width="2" height="10" fill="#374151" />

  <rect x="770" y="278" width="10" height="2" fill="#374151" />
  <rect x="778" y="270" width="2" height="10" fill="#374151" />

  <!-- Code Decorator -->
  <g transform="translate(60, 45)">
    <circle cx="10" cy="10" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="25" cy="10" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="40" cy="10" r="5" fill="#10B981" opacity="0.8" />
  </g>

  <g transform="translate(60, 240)">
    <text x="0" y="0" class="text-code">const developer = {</text>
    <text x="20" y="18" class="text-code">name: 'Jonus Nattapong',</text>
    <text x="20" y="36" class="text-code">skills: ['TypeScript', 'React', 'Node.js', 'Cloud']</text>
    <text x="0" y="54" class="text-code">};</text>
  </g>

  <!-- Main Content Group -->
  <g transform="translate(160, 100)">
    <!-- Tech Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#1F2937" stroke="#374151" stroke-width="1" />
      <circle cx="18" cy="14" r="5" fill="#06B6D4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="19" class="text-accent">FULL-STACK DEV</text>
    </g>

    <!-- Title (Name) -->
    <text x="0" y="70" class="text-title" filter="url(#glow-subtle)">Jonus Nattapong</text>

    <!-- Subtitle (Bio) -->
    <text x="2" y="105" class="text-subtitle">Crafting modern, interactive web applications &amp; digital systems</text>
  </g>

  <!-- Interactive/Dynamic Sparkles (SVG stars) -->
  <g transform="translate(480, 70)" opacity="0.8">
    <path d="M0,8 L3,3 L8,0 L3,-3 L0,-8 L-3,-3 L-8,0 L-3,3 Z" fill="#06B6D4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(130, 200)" opacity="0.6">
    <path d="M0,5 L2,2 L5,0 L2,-2 L0,-5 L-2,-2 L-5,0 L-2,2 Z" fill="#E2E8F0">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite" />
    </path>
  </g>
  <g transform="translate(680, 90)" opacity="0.7">
    <path d="M0,6 L2,2 L6,0 L2,-2 L0,-6 L-2,-2 L-6,0 L-2,2 Z" fill="#EC4899">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite" />
    </path>
  </g>
</svg>
