<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 180" width="840" height="180">
  <defs>
    <style>
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #8B949E; }
      .stat-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 28px; fill: #E6EDF3; }
      .stat-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 11px; fill: #484F58; }
      .rank-ring { fill: none; stroke-width: 3; }
      .rank-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 28px; fill: #E6EDF3; }
      .rank-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 500; font-size: 10px; fill: #8B949E; letter-spacing: 1.5px; }
    </style>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#BC8CFF"/>
    </linearGradient>
  </defs>

  <!-- Main card -->
  <rect class="card" x="0" y="0" width="840" height="170" rx="12"/>

  <!-- LEFT: Rank circle -->
  <g transform="translate(70, 85)">
    <circle cx="0" cy="0" r="50" class="rank-ring" stroke="#21262D"/>
    <circle cx="0" cy="0" r="50" class="rank-ring" stroke="url(#ring-grad)" stroke-dasharray="260 314" stroke-dashoffset="-27" transform="rotate(-90)"/>
    <text x="0" y="8" class="rank-text" text-anchor="middle">S+</text>
    <text x="0" y="68" class="rank-label" text-anchor="middle">RANK</text>
  </g>

  <!-- Divider -->
  <line x1="155" y1="25" x2="155" y2="145" stroke="#21262D" stroke-width="1"/>

  <!-- Stats grid -->
  <!-- Row 1 -->
  <g transform="translate(185, 25)">
    <text x="0" y="18" class="stat-label">Total Contributions</text>
    <text x="0" y="50" class="stat-value">4,444</text>
  </g>

  <g transform="translate(360, 25)">
    <text x="0" y="18" class="stat-label">Total Commits</text>
    <text x="0" y="50" class="stat-value">2,207</text>
  </g>

  <g transform="translate(520, 25)">
    <text x="0" y="18" class="stat-label">Repositories</text>
    <text x="0" y="50" class="stat-value">205</text>
  </g>

  <g transform="translate(680, 25)">
    <text x="0" y="18" class="stat-label">Longest Streak</text>
    <text x="0" y="50" class="stat-value">34</text>
    <text x="52" y="50" class="stat-sub" style="font-size:14px; fill:#8B949E"> days</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(185, 100)">
    <text x="0" y="18" class="stat-label">Pull Requests</text>
    <text x="0" y="50" class="stat-value">12</text>
  </g>

  <g transform="translate(360, 100)">
    <text x="0" y="18" class="stat-label">Issues</text>
    <text x="0" y="50" class="stat-value">2</text>
  </g>

  <g transform="translate(520, 100)">
    <text x="0" y="18" class="stat-label">Stars Given</text>
    <text x="0" y="50" class="stat-value">49</text>
  </g>

  <g transform="translate(680, 100)">
    <text x="0" y="18" class="stat-label">Status</text>
    <text x="0" y="50" class="stat-value" style="fill:#3FB950">Active</text>
  </g>
</svg>
