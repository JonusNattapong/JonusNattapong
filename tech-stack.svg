<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="840" height="160">
  <defs>
    <style>
      .card { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .col-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 1.5px; }
      .tech-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #C9D1D9; }
      .tech-dot { r: 3; }
    </style>
  </defs>

  <rect width="840" height="160" fill="none"/>

  <!-- Col 1: Frontend -->
  <g transform="translate(0, 0)">
    <rect class="card" x="0" y="0" width="200" height="150" rx="10"/>
    <text x="18" y="28" class="col-title" fill="#58A6FF">FRONTEND</text>
    <line x1="18" y1="38" x2="80" y2="38" stroke="#58A6FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="62" class="tech-dot" fill="#61DAFB"/><text x="38" y="66" class="tech-text">React / Next.js</text>
    <circle cx="26" cy="88" class="tech-dot" fill="#3178C6"/><text x="38" y="92" class="tech-text">TypeScript</text>
    <circle cx="26" cy="114" class="tech-dot" fill="#38BDF8"/><text x="38" y="118" class="tech-text">Tailwind CSS</text>
  </g>

  <!-- Col 2: Backend -->
  <g transform="translate(213, 0)">
    <rect class="card" x="0" y="0" width="200" height="150" rx="10"/>
    <text x="18" y="28" class="col-title" fill="#3FB950">BACKEND</text>
    <line x1="18" y1="38" x2="74" y2="38" stroke="#3FB950" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="62" class="tech-dot" fill="#339933"/><text x="38" y="66" class="tech-text">Node.js / Express</text>
    <circle cx="26" cy="88" class="tech-dot" fill="#E0234E"/><text x="38" y="92" class="tech-text">NestJS</text>
    <circle cx="26" cy="114" class="tech-dot" fill="#00ADD8"/><text x="38" y="118" class="tech-text">Golang / Python</text>
  </g>

  <!-- Col 3: Database / Ops -->
  <g transform="translate(426, 0)">
    <rect class="card" x="0" y="0" width="200" height="150" rx="10"/>
    <text x="18" y="28" class="col-title" fill="#BC8CFF">DATABASE / OPS</text>
    <line x1="18" y1="38" x2="106" y2="38" stroke="#BC8CFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="62" class="tech-dot" fill="#4169E1"/><text x="38" y="66" class="tech-text">PostgreSQL</text>
    <circle cx="26" cy="88" class="tech-dot" fill="#47A248"/><text x="38" y="92" class="tech-text">MongoDB / Redis</text>
    <circle cx="26" cy="114" class="tech-dot" fill="#2496ED"/><text x="38" y="118" class="tech-text">Docker &amp; K8s</text>
  </g>

  <!-- Col 4: Tools -->
  <g transform="translate(639, 0)">
    <rect class="card" x="0" y="0" width="200" height="150" rx="10"/>
    <text x="18" y="28" class="col-title" fill="#D29922">TOOLS</text>
    <line x1="18" y1="38" x2="52" y2="38" stroke="#D29922" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="62" class="tech-dot" fill="#F05032"/><text x="38" y="66" class="tech-text">Git / GitHub</text>
    <circle cx="26" cy="88" class="tech-dot" fill="#F24E1E"/><text x="38" y="92" class="tech-text">Figma</text>
    <circle cx="26" cy="114" class="tech-dot" fill="#FCC624"/><text x="38" y="118" class="tech-text">Linux / Bash</text>
  </g>
</svg>
