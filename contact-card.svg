<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 70" width="840" height="70">
  <defs>
    <style>
      .footer-bg { fill: #161B22; stroke: #30363D; stroke-width: 1; }
      .footer-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 400; font-size: 14px; fill: #8B949E; }
      .footer-cta { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #C9D1D9; }
      .footer-link-bg { fill: #21262D; stroke: #30363D; stroke-width: 1; }
      .footer-link-bg:hover { fill: #30363D; }
    </style>
  </defs>

  <rect class="footer-bg" x="0" y="0" width="840" height="60" rx="10"/>

  <!-- Left text -->
  <text x="28" y="36" class="footer-text">Let's build something amazing together</text>

  <!-- Link badges -->
  <g transform="translate(370, 12)">
    <rect class="footer-link-bg" x="0" y="0" width="90" height="36" rx="8"/>
    <text x="45" y="24" class="footer-cta" text-anchor="middle">✉ Email</text>
  </g>

  <g transform="translate(475, 12)">
    <rect class="footer-link-bg" x="0" y="0" width="105" height="36" rx="8"/>
    <text x="52" y="24" class="footer-cta" text-anchor="middle">💼 LinkedIn</text>
  </g>

  <g transform="translate(595, 12)">
    <rect class="footer-link-bg" x="0" y="0" width="105" height="36" rx="8"/>
    <text x="52" y="24" class="footer-cta" text-anchor="middle">🌐 Portfolio</text>
  </g>
</svg>
