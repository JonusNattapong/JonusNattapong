<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Mono&amp;display=swap');
      
      .main-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 15px;
        fill: #9CA3AF;
      }
      
      .btn-bg {
        fill: #111827;
        stroke: #1F2937;
        stroke-width: 1.5;
        rx: 8px;
        transition: all 0.3s ease;
      }
      
      .btn-bg:hover {
        stroke: #6366F1;
        fill: #1F2937;
      }
      
      .btn-text {
        font-family: 'Space Mono', monospace;
        font-weight: 600;
        font-size: 12px;
        fill: #E5E7EB;
      }
      
      .btn-icon {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="120" rx="16" fill="#0B0F19" stroke="#1F2937" stroke-width="1" />
  
  <!-- Subtle Grid Dots pattern -->
  <pattern id="dot-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1F2937" />
  </pattern>
  <rect width="800" height="120" fill="url(#dot-pattern)" rx="16" />

  <!-- Content Group -->
  <g transform="translate(40, 48)">
    <text x="0" y="16" class="main-text">Let's build something amazing together!</text>
  </g>

  <!-- Social Button 1: Email -->
  <g transform="translate(360, 40)">
    <rect class="btn-bg" x="0" y="0" width="120" height="40" />
    <!-- Mail Icon -->
    <g transform="translate(15, 10)">
      <path class="btn-icon" stroke="#EF4444" d="M3,5 H17 A2,2 0 0,1 19,7 V17 A2,2 0 0,1 17,19 H3 A2,2 0 0,1 1,17 V7 A2,2 0 0,1 3,5 Z" />
      <path class="btn-icon" stroke="#EF4444" d="M1,7 L10,13 L19,7" />
    </g>
    <text x="45" y="24" class="btn-text">Email</text>
  </g>

  <!-- Social Button 2: LinkedIn -->
  <g transform="translate(495, 40)">
    <rect class="btn-bg" x="0" y="0" width="120" height="40" />
    <!-- LinkedIn Icon -->
    <g transform="translate(15, 10)">
      <path class="btn-icon" stroke="#0A66C2" d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
      <rect class="btn-icon" stroke="#0A66C2" x="2" y="9" width="4" height="12" />
      <circle cx="4" cy="4" r="2" fill="#0A66C2" />
    </g>
    <text x="45" y="24" class="btn-text">LinkedIn</text>
  </g>

  <!-- Social Button 3: Portfolio -->
  <g transform="translate(630, 40)">
    <rect class="btn-bg" x="0" y="0" width="130" height="40" />
    <!-- Globe Icon -->
    <g transform="translate(15, 10)">
      <circle cx="10" cy="10" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
      <line x1="2" y1="10" x2="18" y2="10" fill="none" stroke="#10B981" stroke-width="1.5"/>
      <path d="M10,2 A15,15 0 0,0 10,18 A15,15 0 0,0 10,2" fill="none" stroke="#10B981" stroke-width="1.5"/>
    </g>
    <text x="45" y="24" class="btn-text">Portfolio</text>
  </g>

</svg>
